name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify cping is executable
        run: test -x ./cping

      - name: Run smoke tests
        run: bash tests/smoke.sh

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest tests.test_unit -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Verify installed cping --version
        run: cping --version | grep -q "cping 0.1.0"

      - name: Verify python -m cping --version
        run: python -m cping --version | grep -q "cping 0.1.0"

      - name: Install from sdist
        run: |
          pip uninstall -y cping-cli
          pip install dist/*.tar.gz

      - name: Verify sdist install
        run: cping --version | grep -q "cping 0.1.0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check cping src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check cping src/ tests/

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify cping and src/cping/cli.py are in sync
        run: |
          # Strip the shebang line from the standalone cping script
          tail -n +2 ./cping > /tmp/cping_body.py
          # Compare with cli.py (they should be identical)
          if ! diff -u src/cping/cli.py /tmp/cping_body.py; then
            echo "ERROR: cping (minus shebang) and src/cping/cli.py are out of sync"
            exit 1
          fi
          echo "OK: cping and src/cping/cli.py are in sync"
